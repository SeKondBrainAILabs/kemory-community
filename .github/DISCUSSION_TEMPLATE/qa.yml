title: "[Q&A] "
labels: []
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to do with Kemory Community?
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
      description: Include the commands or configuration you used.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Remove API keys and other secrets before posting.
      render: shell
