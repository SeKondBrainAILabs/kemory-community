name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Apple Silicon Macs and ARM Linux hosts need arm64 images; without them
      # the installer pulls amd64-only images that run under emulation or not
      # at all. QEMU lets the amd64 runner build the arm64 variant.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and push multi-arch images
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          PLATFORMS="linux/amd64,linux/arm64"

          docker buildx build --platform "${PLATFORMS}" --push \
            -t "${REPO}-api:${VERSION}" -t "${REPO}-api:latest" .
          docker buildx build --platform "${PLATFORMS}" --push \
            -t "${REPO}-dashboard:${VERSION}" -t "${REPO}-dashboard:latest" ./dashboard

          for image in api dashboard; do
            docker buildx imagetools inspect "${REPO}-${image}:${VERSION}" \
              | grep -q "linux/arm64" || { echo "::error::${image} is missing linux/arm64"; exit 1; }
          done

  publish-npm:
    needs: publish-docker
    runs-on: ubuntu-latest
    # Waits for a required reviewer to approve. The npm trusted publisher only
    # accepts publishes from this environment, which is limited to v* tags.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later. No NPM_TOKEN: npm
      # accepts this workflow's id-token because kemory-community lists
      # SeKondBrainAILabs/kemory-community release.yml as its trusted publisher.
      - run: npm install -g npm@^11.5.1
      - run: npm install --package-lock=false
      - run: npm test
      - run: npm run prepublishOnly
      - run: npm publish --access public
