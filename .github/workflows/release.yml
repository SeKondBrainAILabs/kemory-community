name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  # Runs before anything is published. A release that cannot complete should
  # fail while it is still a no-op, not after the images are already public
  # and only the npm half is missing.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not configured, so this version tag cannot be published to npm. Add the NPM_TOKEN repository secret and re-run this workflow. Nothing has been published."
            exit 1
          fi

  publish-docker:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push images
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          docker build -t "${REPO}-api:${VERSION}" -t "${REPO}-api:latest" .
          docker build -t "${REPO}-dashboard:${VERSION}" -t "${REPO}-dashboard:latest" ./dashboard

          docker push "${REPO}-api:${VERSION}"
          docker push "${REPO}-api:latest"
          docker push "${REPO}-dashboard:${VERSION}"
          docker push "${REPO}-dashboard:latest"

  publish-npm:
    needs: publish-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install --package-lock=false
      - run: npm test
      - run: npm run prepublishOnly
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
