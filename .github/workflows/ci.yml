name: ci
on:
  push:
    branches: [main, dev-sync]
  pull_request:

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Working tree only (--no-git), per the reasoning in .gitleaks.toml.
      # gitleaks exits 1 when it finds something, which fails the job.
      - name: gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --verbose

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Root CLI tests
        run: npm install --package-lock=false && npm test && npm run prepublishOnly
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check '.[backend,platform,local,dev]' 'ruff==0.7.4'
      - name: Python lint and syntax
        run: |
          ruff check backend kemory kemory_cli tests scripts
          python -m compileall backend kemory kemory_cli scripts
      - name: Python unit tests
        run: PYTHONPATH=. pytest -q -o addopts= tests/unit
      - name: Dashboard lint, test, and build
        working-directory: dashboard
        run: npm ci && npm run lint && npm test && npm run build
      - name: Compose config
        run: docker compose -f docker-compose.community.yml config >/dev/null
