name: ci
on:
  push:
    branches: [main, dev-sync]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Root CLI tests
        run: npm install --package-lock=false && npm test && npm run prepublishOnly
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check '.[backend,platform,local,dev]' 'ruff==0.7.4'
      - name: Python lint and syntax
        run: |
          ruff check backend kemory kemory_cli tests
          python -m compileall backend kemory kemory_cli
      - name: Python unit tests
        run: PYTHONPATH=. pytest -q -o addopts= tests/unit
      - name: Dashboard lint, test, and build
        working-directory: dashboard
        run: npm ci && npm run lint && npm test && npm run build
      - name: Compose config
        run: docker compose -f docker-compose.community.yml config >/dev/null
