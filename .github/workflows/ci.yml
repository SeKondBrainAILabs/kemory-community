name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Working tree only (--no-git), per the reasoning in .gitleaks.toml.
      # gitleaks exits 1 when it finds something, which fails the job.
      - name: gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          # Pinned by version AND checksum. A secret scanner that pipes an
          # unverified tarball straight into tar would be its own supply-chain
          # hole; the digest is what makes the pin mean anything. Update both
          # together when bumping.
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --verbose

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Root CLI tests
        run: npm install --package-lock=false && npm test && npm run prepublishOnly
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check '.[backend,platform,local,dev]' 'ruff==0.16.3'
      - name: Python lint and syntax
        run: |
          ruff check backend kemory kemory_cli tests scripts
          python -m compileall backend kemory kemory_cli scripts
      - name: Python unit tests
        run: PYTHONPATH=. pytest -q -o addopts= tests/unit
      - name: Dashboard lint, test, and build
        working-directory: dashboard
        run: npm ci && npm run lint && npm test && npm run build
      - name: Compose config
        run: docker compose -f docker-compose.community.yml config >/dev/null
      - name: Shared-infra compose config
        env:
          KEMORY_COMMUNITY_DB_PASSWORD: ci-only
          KEMORY_LOCAL_API_KEY: ci-only
          KEMORY_LOCAL_BLOB_SIGNING_KEY: ci-only-blob-signing-key-32-bytes
        run: docker compose -f docker-compose.shared.yml config >/dev/null
