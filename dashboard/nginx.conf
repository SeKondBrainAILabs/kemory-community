server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Variable proxy_pass requires an explicit resolver. The entrypoint replaces
    # this placeholder with the first nameserver from the container.
    resolver __DNS_RESOLVER__ valid=30s ipv6=off;

    # Runtime configuration and the SPA entrypoint must not survive a deploy in
    # browser cache. Content-hashed assets remain immutable below.
    location = /config.json {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API / health / MCP proxy.
    #
    # Upstream `kemory-api` resolves in docker-compose where the API
    # container shares a Docker network. In k8s the backend Service is
    # named `kemory` (not `kemory-api`), and the SPA's ky client rewrites
    # /api/* to config.json:API_URL anyway (kemory#54), so these blocks
    # never get hit in k8s deployments. We still need nginx to START
    # cleanly though — using `set $var` defers resolution to request
    # time so a missing upstream doesn't refuse-to-boot the whole pod.
    # Same pattern as the /auth/ proxy below.
    location /api/ {
        set $kemory_api_upstream http://kemory-api:8000;
        proxy_pass $kemory_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        set $kemory_api_upstream http://kemory-api:8000;
        proxy_pass $kemory_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mcp/ {
        set $kemory_api_upstream http://kemory-api:8000;
        proxy_pass $kemory_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
